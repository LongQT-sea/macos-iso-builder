name: Build Recovery ISO image

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: 'Select a macOS version to build'
        required: true
        type: choice
        options:
          - ''
          - 'Tahoe'
          - 'Sequoia'
          - 'Sonoma'
          - 'Ventura'
          - 'Monterey'
          - 'Big Sur'
          - 'Catalina'
          - 'Mojave'
          - 'High Sierra'

jobs:
  preflight:
    if: ${{ inputs.macos_version != '' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      _build: ${{ steps.check.outputs._build }}

    steps:
      - name: Preflight
        id: check
        run: |
          echo "_build=false" >> $GITHUB_OUTPUT
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          # Third time's the charm
          if [ ${{ github.run_attempt }} -ge 3 ] || [ ${{ github.run_number }} -ge 3 ]; then
            echo "_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Most users arrive directly at the Actions tab without reading the
          # README, missing the prebuilt images in the Releases tab. Requiring
          # a star (step 1 of the README) reduces redundant builds - and runner
          # costs - for images that may already exist in a recent forks list.
          #
          # GET /repos/{owner}/{repo}/stargazers has been admin/collaborator
          # only since 2026-06-30, and Actions' app-install token is refused
          # even on its own repo ("Resource not accessible by integration").
          # Ask the reverse question instead - is this repo in the actor's
          # starred list - which is still unrestricted. Sorted newest-first,
          # so a star made just before dispatching lands on page 1.
          FOUND=false
          PAGE=1
          while [ $PAGE -le 5 ]; do
            DATA=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/${{ github.actor }}/starred?per_page=100&page=${PAGE}")
            [ "$(echo "$DATA" | jq -r 'type')" = "array" ] || break
            echo "$DATA" | jq -e 'any(.[]; .full_name == "LongQT-sea/macos-iso-builder")' > /dev/null && FOUND=true && break
            [ "$(echo "$DATA" | jq 'length')" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          if [ "$FOUND" = "true" ]; then
            echo "_build=true" >> $GITHUB_OUTPUT
          else
            sum "## Before you build - check if someone already did it for you :point_down:" \
                "" \
                "Browse the **[Recent Forks List](https://github.com/LongQT-sea/macos-iso-builder/releases/latest)** - someone may have already built the macOS version you need." \
                "" \
                "If you still need to build your own, star this repo first [LongQT-sea/macos-iso-builder](https://github.com/LongQT-sea/macos-iso-builder) - that's step 1 in the [README](https://github.com/LongQT-sea/macos-iso-builder#how-to-use). :star:" \
                "<br>![star](https://raw.githubusercontent.com/LongQT-sea/macos-iso-builder/main/.github/star.jpg)"
          fi

  build-recovery-iso:
    needs: preflight
    if: needs.preflight.outputs._build == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System Information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo ""
          df -h $(mktemp)
          echo ""
          echo "RAM: $(top -l 1 | grep PhysMem)"
          echo ""
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo ""
          echo "Python version: $(python3 --version)"

      - name: Download macrecovery.py
        run: |
          echo "Downloading macrecovery.py from acidanthera/OpenCorePkg..."
          curl --retry 3 --max-time 10 --connect-timeout 3 -OL "https://raw.githubusercontent.com/acidanthera/OpenCorePkg/master/Utilities/macrecovery/macrecovery.py"

      - name: Get version info
        id: version_info
        run: |
          case "${{ github.event.inputs.macos_version }}" in
            "High Sierra") KEY="high_sierra1" ;;
            "Mojave") KEY="mojave" ;;
            "Catalina") KEY="catalina1" ;;
            "Big Sur") KEY="big_sur" ;;
            "Monterey") KEY="monterey" ;;
            "Ventura") KEY="ventura" ;;
            "Sonoma") KEY="sonoma" ;;
            "Sequoia") KEY="sequoia" ;;
            "Tahoe") KEY="tahoe" ;;
          esac

          case $KEY in
            high_sierra1) INFO="Mac-7BA5B2D9E42DDD94:00000000000J80300:High_Sierra:" ;;
            mojave) INFO="Mac-7BA5B2DFE22DDD8C:00000000000KXPG00:Mojave:" ;;
            catalina1) INFO="Mac-CFF7D910A743CAAF:00000000000PHCD00:Catalina:" ;;
            big_sur) INFO="Mac-2BD1B31983FE1663:00000000000000000:Big_Sur:" ;;
            monterey) INFO="Mac-E43C1C25D4880AD6:00000000000000000:Monterey:" ;;
            ventura) INFO="Mac-B4831CEBD52A0C4C:00000000000000000:Ventura:" ;;
            sonoma) INFO="Mac-827FAC58A8FDFA22:00000000000000000:Sonoma:" ;;
            sequoia) INFO="Mac-7BA5B2D9E42DDD94:00000000000000000:Sequoia:" ;;
            tahoe) INFO="Mac-CFF7D910A743CAAF:00000000000000000:Tahoe:latest" ;;
          esac

          IFS=':' read -r BOARD_ID MODEL VERSION_NAME OS_FLAG <<< "$INFO"

          echo "board_id=$BOARD_ID" >> $GITHUB_OUTPUT
          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "os_flag=$OS_FLAG" >> $GITHUB_OUTPUT

      - name: Download macOS Recovery
        id: download_recovery_image
        run: |
          echo "Downloading macOS ${{ steps.version_info.outputs.version_name }} recovery..."
          
          if [ -n "${{ steps.version_info.outputs.os_flag }}" ]; then
            script -q /dev/null python3 macrecovery.py -b "${{ steps.version_info.outputs.board_id }}" -m "${{ steps.version_info.outputs.model }}" -os "${{ steps.version_info.outputs.os_flag }}" download
          else
            script -q /dev/null python3 macrecovery.py -b "${{ steps.version_info.outputs.board_id }}" -m "${{ steps.version_info.outputs.model }}" download
          fi

      - name: Create Recovery ISO
        id: create_iso
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          ISO_FILE="macOS_${VERSION_NAME}_Recovery.iso"
          RECOVERY_PATH="com.apple.recovery.boot/BaseSystem.dmg"

          sudo hdiutil makehybrid -hfs -udf -default-volume-name "${VERSION_NAME}_Recovery" -o "$ISO_FILE" "$RECOVERY_PATH"

          if [ -f "$ISO_FILE" ]; then
            ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
            echo "ISO created successfully!"
            echo "ISO size: $ISO_SIZE"
            echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Compress ISO
        id: compress_iso
        run: |
          ISO_FILE="${{ steps.create_iso.outputs.iso_file }}"
          ZIP_FILE="${ISO_FILE}.zip"

          echo "Compressing ISO with zip..."
          zip -j "$ZIP_FILE" "$ISO_FILE"
          echo "compressed_file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Publish Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_info.outputs.version_name }}
          ASSET: ${{ steps.compress_iso.outputs.compressed_file }}
        run: |
          version_slug=$(printf '%s' "$VERSION" | tr '[:upper:]_' '[:lower:]-')
          tag="macos-${version_slug}-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/publish-release.sh "$ASSET" "$tag" "macOS ${VERSION} Recovery"

      - name: Summary
        if: always()
        run: |
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "${{ steps.download_recovery_image.outcome }}" == "failure" ]; then
            sum "## Download RecoveryOS failed" \
                "" \
                "> [!WARNING]" \
                "> This runner may have network issues. Please **re-run the workflow** to try a different runner."
          elif [ "${{ job.status }}" == "success" ]; then
            sum "## Successfully built **macOS ${{ steps.version_info.outputs.version_name }} Recovery** ISO" \
                "" \
                "> [!Important]" \
                "> This ISO image is intended for creating macOS virtual machine on Proxmox VE, QEMU, and VMware." \
                "" \
                "> [!TIP]" \
                "> Enable [Cloudflare WARP](https://one.one.one.one/) for faster download from GitHub Releases."
          fi
